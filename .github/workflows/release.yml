name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write  # npm provenance via GitHub OIDC

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine next version
        id: version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "latest_tag=${LATEST_TAG}" >> "$GITHUB_OUTPUT"

          CURRENT="${LATEST_TAG#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          COMMITS=$(git log "${LATEST_TAG}..HEAD" --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")

          BUMP="patch"
          if echo "$COMMITS" | grep -qiE "BREAKING CHANGE|^[a-z]+(\(.+\))?!:"; then
            BUMP="major"
          elif echo "$COMMITS" | grep -qE "^feat(\(.+\))?:"; then
            BUMP="minor"
          fi

          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bump=${BUMP}" >> "$GITHUB_OUTPUT"
          echo "Next version: v${NEW_VERSION} (${BUMP} bump)"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # npm is only used for the publish steps: `bun publish` has no --provenance flag.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'  # Node LTS (matches mise.toml); prototype requires >=22, CLI >=18
          registry-url: 'https://registry.npmjs.org'

      # Gate the release on tests BEFORE any version bump/tag/publish.
      - name: Test CLI
        working-directory: packages/design-token-extractor
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium
          bun run test

      - name: Test prototype
        working-directory: packages/prototype
        run: |
          bun install --frozen-lockfile
          bun run test

      - name: Update version files
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" .claude-plugin/marketplace.json
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" plugin/.claude-plugin/plugin.json
          ( cd packages/design-token-extractor && bun pm version "${VERSION}" --no-git-tag-version --allow-same-version )
          ( cd packages/prototype && bun pm version "${VERSION}" --no-git-tag-version --allow-same-version )

      # Rebuild the prototype runtime and repin its versioned URL + SRI hash in
      # the skill, so the served bytes and the tag the skill injects stay in
      # lockstep. The skill files ship inside the npm package (prepublishOnly),
      # which is where ai-to-design.com picks them up.
      - name: Build prototype and repin URL + SRI hash
        id: runtime
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ( cd packages/prototype && bun run build )
          HASH="sha384-$(openssl dgst -sha384 -binary packages/prototype/dist/prototype.min.js | openssl base64 -A)"
          echo "prototype.min.js integrity: ${HASH}"
          sed -i -E \
            -e "s#sha384-[A-Za-z0-9+/=]+#${HASH}#g" \
            -e "s#https://ai-to-design\.com/runtime/[^/]+/prototype\.min\.js#https://ai-to-design.com/runtime/${VERSION}/prototype.min.js#g" \
            plugin/skills/prototype/SKILL.md \
            plugin/skills/prototype/references/dom-contract-v1.md
          echo "integrity=${HASH}" >> "$GITHUB_OUTPUT"

      - name: Build CLI
        working-directory: packages/design-token-extractor
        run: bun run build

      # Publishing stays on npm: `bun publish` has no --provenance flag.
      # Skipping an already-published version keeps re-runs from failing on 409.
      - name: Publish CLI to npm
        working-directory: packages/design-token-extractor
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="$(bun pm pkg get name | tr -d '"')"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm; skipping."
          else
            npm publish --provenance
          fi

      - name: Publish prototype to npm
        working-directory: packages/prototype
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          NAME="$(bun pm pkg get name | tr -d '"')"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "${NAME}@${VERSION} is already on npm; skipping."
          else
            npm publish --provenance
          fi

      # ai-to-design.com serves /runtime/<version>/prototype.min.js from npm,
      # hash-checked (I2olanD/ai.to.design, .github/workflows/prototype-runtime.yml).
      # Needs WEBSITE_DISPATCH_TOKEN: a fine-grained PAT for that repo with
      # Contents read/write, which repository dispatch requires.
      - name: Register the runtime on ai-to-design.com
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_DISPATCH_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          INTEGRITY: ${{ steps.runtime.outputs.integrity }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::WEBSITE_DISPATCH_TOKEN is not set; the runtime would never reach ai-to-design.com."
            exit 1
          fi
          gh api repos/I2olanD/ai.to.design/dispatches \
            -f event_type=prototype-released \
            -f "client_payload[version]=${VERSION}" \
            -f "client_payload[integrity]=${INTEGRITY}"

      # The skill is pushed only once the URL it pins serves those exact bytes
      # with CORS (required by crossorigin="anonymous"), so no one can install
      # a skill whose picker script fails to load.
      - name: Wait until the runtime is live
        env:
          VERSION: ${{ steps.version.outputs.version }}
          INTEGRITY: ${{ steps.runtime.outputs.integrity }}
        run: |
          URL="https://ai-to-design.com/runtime/${VERSION}/prototype.min.js"
          for attempt in $(seq 1 90); do
            if curl -fsS -H "Origin: https://example.com" -D headers.txt -o live.js "$URL" 2>/dev/null; then
              LIVE="sha384-$(openssl dgst -sha384 -binary live.js | openssl base64 -A)"
              if [ "$LIVE" = "$INTEGRITY" ] && grep -qi '^access-control-allow-origin:' headers.txt; then
                echo "Live: ${URL}"
                exit 0
              fi
              echo "Attempt ${attempt}: served ${LIVE}, CORS header: $(grep -ci '^access-control-allow-origin:' headers.txt)"
            else
              echo "Attempt ${attempt}: ${URL} not reachable yet"
            fi
            sleep 20
          done
          echo "::error::${URL} did not serve ${INTEGRITY} with CORS within 30 minutes. Check the prototype-runtime and deploy workflows in I2olanD/ai.to.design, then re-run this job."
          exit 1

      # Bookkeeping is skipped outright when the tag is already there, so a
      # re-run of a release that died after tagging proceeds to publish instead
      # of failing on `tag already exists` and wedging the version forever.
      - name: Commit, tag, and push
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "v${VERSION} is already committed and tagged; skipping bookkeeping."
            exit 0
          fi
          git add .claude-plugin/marketplace.json plugin/.claude-plugin/plugin.json \
            packages/design-token-extractor/package.json \
            packages/prototype/package.json \
            plugin/skills/prototype/SKILL.md \
            plugin/skills/prototype/references/dom-contract-v1.md
          git commit -m "chore: release v${VERSION} [skip ci]"
          # main may have moved while this job waited for the website; this
          # commit only touches version and pin lines, so it rebases cleanly.
          git pull --rebase origin main
          git tag "v${VERSION}"
          git push origin main --tags

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists."
          else
            gh release create "v${VERSION}" \
              --title "v${VERSION}" \
              --generate-notes
          fi
